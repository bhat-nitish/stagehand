apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inventory.fullname" . }}-migrate
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "inventory.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Triggers the migration entrypoint in Program.cs, then exits.
          args: ["migrate"]
          env:
            {{- include "inventory.dbEnv" . | nindent 12 }}
            {{- include "inventory.rabbitEnv" . | nindent 12 }}

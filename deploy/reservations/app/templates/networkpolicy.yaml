{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reservations.fullname" . }}
  labels:
    {{- include "reservations.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reservations.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.gatewayName }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rabbitmq.secretName }}
  labels:
    {{- include "reservations.labels" . | nindent 4 }}
  annotations:
    # Must exist before the migration Job, which is itself a pre-install hook and
    # would otherwise start before regular chart resources are created. Weight is
    # lower than the Job's so it is applied first; before-hook-creation leaves it
    # in place afterwards for the Deployment to use.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.username | quote }}
  password: {{ .Values.rabbitmq.password | quote }}
